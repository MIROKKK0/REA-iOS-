name: REA
options:
  bundleIdPrefix: com.mirokkk
  deploymentTarget:
    iOS: "16.0"
targets:
  REA:
    type: application
    platform: iOS
    sources:
      - REAApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mirokkk.rea
        PRODUCT_NAME: REA
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_CFBundleDisplayName: "REA"
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.developer-tools"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        GENERATE_INFOPLIST_FILE: "YES"
