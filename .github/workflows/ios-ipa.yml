name: Build REA iOS IPA
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ios/**"
      - ".github/workflows/ios-ipa.yml"
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate
      - name: Build unsigned app
        working-directory: ios
        run: |
          xcodebuild -project REA.xcodeproj -scheme REA -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Package unsigned IPA for SideStore
        run: |
          APP_PATH="ios/build/Build/Products/Release-iphoneos/REA.app"
          test -d "$APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/REA.app
          /usr/bin/zip -qry REA-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: REA-unsigned-IPA
          path: REA-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
