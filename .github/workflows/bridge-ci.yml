name: REA bridge CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npm test
      - name: Start official REA MCP and discover real tools
        run: npm run smoke
      - name: Verify authenticated IPA upload/download roundtrip
        run: node scripts/upload-route-smoke.mjs
